[pytest]
testpaths = tests

# pytest keeps the last 3 runs' tmp_path trees so you can inspect artifacts
# after a failure, and by default keeps them for PASSING tests too. That
# default is what let 2.4GB pile up in the runner's shared /tmp on
# 2026-08-14 (see tests/conftest.py for the 122MB-per-test half of that
# story). Keeping only failures — and only the last run — preserves the
# debugging value and drops the hoarding.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
